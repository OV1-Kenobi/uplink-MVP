# cargo-deny configuration for Uplink
# Run: cargo deny --manifest-path Cargo.toml check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
]
deny = []
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

# ---------------------------------------------------------------------------
# BOUNDARY ENFORCEMENT: no unauthorized HTTP/WebSocket client crates
# ---------------------------------------------------------------------------
# The ONLY permitted network-capable crates are those explicitly listed
# in uplink-wallet and uplink-nostr (behind feature flags).
# Any new crate that brings in an HTTP or WS client must be reviewed.
deny = [
    # Prevent unauthorized HTTP client crates (must go through wasm surface)
    { name = "reqwest", wrappers = ["uplink-wallet", "uplink-nostr"] },
    { name = "hyper", wrappers = ["uplink-wallet", "uplink-nostr"] },
    { name = "ureq" },
    { name = "surf" },
    # Prevent unauthorized WebSocket crates (relay WS must go through uplink-nostr)
    { name = "tungstenite", wrappers = ["uplink-nostr", "nostr-sdk"] },
    { name = "tokio-tungstenite", wrappers = ["uplink-nostr", "nostr-sdk"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
