[package]
name        = "uplink-core"
description = "wasm-bindgen boundary — the ONLY crate exposed to TypeScript"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
# REQUIRED for the wasm build, not cosmetic: `universal-time` 0.3 (pulled in by
# `nostr`) resolves its time provider through a link symbol whose name embeds
# universal-time's own `CARGO_PKG_HOMEPAGE`. The `define_time_provider!` macro we
# call in `src/lib.rs` re-derives that name from THIS crate's homepage, so the two
# only match when they are identical. Pinning it here lets the macro export the
# provider under the exact symbol `nostr` looks up on wasm32-unknown-unknown.
homepage    = "https://github.com/shadowylab/universal-time"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default  = []
wasm     = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
    "dep:universal-time",
    "uplink-storage/wasm",
    "uplink-wallet/wasm",
    "uplink-nostr/wasm",
]
native   = [
    "uplink-storage/native",
    "uplink-wallet/native",
    "uplink-nostr/native",
]

[dependencies]
nostr            = { workspace = true }
wasm-bindgen-futures = { workspace = true }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# `nostr` pulls in `universal-time`, which on wasm32-unknown-unknown requires an
# explicit link-time time provider (std::time is unavailable). Supplied below.
universal-time = { version = "0.3", default-features = false, optional = true }
uplink-identity  = { workspace = true }
uplink-wallet    = { workspace = true }
uplink-nostr     = { workspace = true }
uplink-accounts  = { workspace = true }
uplink-scheduler = { workspace = true }
uplink-receipts  = { workspace = true }
uplink-storage   = { workspace = true }
uplink-cashu     = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

wasm-bindgen = { workspace = true, optional = true }
js-sys       = { workspace = true, optional = true }
web-sys      = { workspace = true, optional = true }
