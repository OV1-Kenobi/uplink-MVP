[workspace]
resolver = "2"
members = [
    "crates/uplink-identity",
    "crates/uplink-wallet",
    "crates/uplink-cashu",
    "crates/uplink-nostr",
    "crates/uplink-accounts",
    "crates/uplink-scheduler",
    "crates/uplink-receipts",
    "crates/uplink-storage",
    "crates/uplink-core",
    "host-cli",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/OV1-Kenobi/uplink"
rust-version  = "1.75"

# ---------------------------------------------------------------------------
# Shared dependency versions (all surfaces use these; crates pin via workspace = true)
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates
uplink-identity  = { path = "crates/uplink-identity" }
uplink-wallet    = { path = "crates/uplink-wallet" }
uplink-cashu     = { path = "crates/uplink-cashu" }
uplink-nostr     = { path = "crates/uplink-nostr" }
uplink-accounts  = { path = "crates/uplink-accounts" }
uplink-scheduler = { path = "crates/uplink-scheduler" }
uplink-receipts  = { path = "crates/uplink-receipts" }
uplink-storage   = { path = "crates/uplink-storage" }
uplink-core      = { path = "crates/uplink-core" }

# Nostr (rust-nostr ecosystem)
nostr            = { version = "0.45.0-alpha.1", features = ["nip44", "nip59"] }
nostr-sdk        = { version = "0.45.0-alpha.1", default-features = false }

# Bitcoin / Lightning
bitcoin          = { version = "0.32", features = ["serde"] }
bip39            = "2.2"
ldk-node         = { version = "0.7", default-features = false }
lightning        = { version = "0.2", default-features = false }
lightning-invoice = "0.34"

# eCash
cdk              = { version = "0.17.0-rc.1", default-features = false }

# Crypto / encoding
sha2             = "0.10"
hex              = "0.4"
aes-gcm          = "0.10"
rand             = "0.8"
argon2           = "0.5"

getrandom        = { version = "0.3", features = ["wasm_js"] }

# Persistence
sled             = "0.34"

# Serialization
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Async runtime
tokio            = { version = "1" }
async-trait      = "0.1"

# wasm
wasm-bindgen     = "0.2"
wasm-bindgen-futures = "0.4"

js-sys           = "0.3"
web-sys          = { version = "0.3", features = ["WebSocket", "Window", "IdbFactory", "Storage"] }

# Error handling
thiserror        = "1"
anyhow           = "1"

# CLI (host-cli only)
clap             = { version = "4", features = ["derive", "env"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid             = "1.7"

[workspace.lints.rust]
missing_docs     = "allow"
unexpected_cfgs  = { level = "allow" }

[workspace.lints.clippy]
pedantic         = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
