[build]
  command = "bash scripts/netlify-build.sh"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "24"

# COOP/COEP headers — required by browsers for Wasm + SharedArrayBuffer
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Service worker must not be long-cached (breaks PWA updates)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hash-named static assets can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — React Router needs all paths to serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
